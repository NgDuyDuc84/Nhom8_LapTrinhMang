[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", ".presentation-build", "tmp", "output", "tools/presentations"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.ruff.lint.per-file-ignores]
"tests/test_arp_listener.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend", "config", "models", "main", "core", "db", "extras", "services", "ui"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
